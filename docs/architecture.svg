<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <style>
      .t{font-weight:700}
      .s{fill:#475569;font-size:12px}
      .lbl{fill:#64748b;font-size:11px;font-style:italic}
      .edge{stroke:#64748b;stroke-width:1.6;fill:none}
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="600" fill="#ffffff"/>
  <text x="40" y="40" font-size="22" class="t" fill="#065f46">JëfPass</text>
  <text x="140" y="40" font-size="15" fill="#64748b">architecture — work agreement, Lightning payment evidence, verifiable receipts</text>

  <!-- Clients -->
  <rect x="40" y="90" width="214" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="147" y="122" text-anchor="middle" font-size="15" class="t" fill="#1d4ed8">Worker workspace</text>
  <text x="147" y="142" text-anchor="middle" class="s">/app · installable PWA</text>
  <text x="147" y="159" text-anchor="middle" class="lbl">English / French · offline drafts</text>

  <rect x="40" y="185" width="214" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="147" y="217" text-anchor="middle" font-size="15" class="t" fill="#1d4ed8">Customer</text>
  <text x="147" y="237" text-anchor="middle" class="s">/confirm/[token]</text>
  <text x="147" y="254" text-anchor="middle" class="lbl">no account · one-time key</text>

  <!-- Cloudflare Worker -->
  <rect x="330" y="78" width="286" height="200" rx="14" fill="#fff7ed" stroke="#f6821f" stroke-width="2"/>
  <text x="473" y="110" text-anchor="middle" font-size="16" class="t" fill="#c2410c">Cloudflare Worker</text>
  <text x="473" y="131" text-anchor="middle" class="s">Next.js App Router · OpenNext</text>
  <text x="473" y="148" text-anchor="middle" class="lbl">nodejs_compat runtime</text>
  <rect x="352" y="166" width="242" height="94" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.4"/>
  <text x="473" y="188" text-anchor="middle" font-size="13" class="t" fill="#9a3412">API handlers</text>
  <text x="473" y="208" text-anchor="middle" class="s">account ownership · same-origin</text>
  <text x="473" y="226" text-anchor="middle" class="s">rate limits · bounded JSON</text>
  <text x="473" y="244" text-anchor="middle" class="s">service state &#8800; payment state</text>

  <!-- D1 -->
  <rect x="692" y="90" width="188" height="176" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="786" y="120" text-anchor="middle" font-size="15" class="t" fill="#047857">Cloudflare D1</text>
  <text x="786" y="138" text-anchor="middle" class="lbl">SQLite · source of truth</text>
  <rect x="712" y="152" width="148" height="30" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="786" y="172" text-anchor="middle" class="s">documents</text>
  <rect x="712" y="188" width="148" height="30" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="786" y="208" text-anchor="middle" class="s">rate_limits</text>
  <rect x="712" y="224" width="148" height="30" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="786" y="244" text-anchor="middle" class="s">app_secrets · keys</text>

  <!-- Integrations -->
  <rect x="330" y="316" width="168" height="92" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="414" y="344" text-anchor="middle" font-size="14" class="t" fill="#6d28d9">Fireworks AI</text>
  <text x="414" y="364" text-anchor="middle" class="s">OpenAI-compatible</text>
  <text x="414" y="382" text-anchor="middle" class="lbl">optional scope drafts</text>
  <text x="414" y="398" text-anchor="middle" class="lbl">no authority over money</text>

  <rect x="516" y="316" width="168" height="92" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="600" y="344" text-anchor="middle" font-size="14" class="t" fill="#b45309">Lightning wallet</text>
  <text x="600" y="364" text-anchor="middle" class="s">NWC · receive-only</text>
  <text x="600" y="382" text-anchor="middle" class="lbl">invoice + settlement check</text>
  <text x="600" y="398" text-anchor="middle" class="lbl">preimage &#8594; payment hash</text>

  <rect x="702" y="316" width="178" height="92" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="1.6"/>
  <text x="791" y="344" text-anchor="middle" font-size="14" class="t" fill="#be185d">Nostr</text>
  <text x="791" y="364" text-anchor="middle" class="s">relays · signatures</text>
  <text x="791" y="382" text-anchor="middle" class="lbl">worker receipt commitments</text>
  <text x="791" y="398" text-anchor="middle" class="lbl">customer proofs (local)</text>

  <!-- Edges -->
  <path class="edge" d="M254,130 L326,150" marker-end="url(#arrow)"/>
  <path class="edge" d="M254,225 L326,200" marker-end="url(#arrow)"/>
  <path class="edge" d="M616,178 L688,178" marker-end="url(#arrow)"/>
  <path class="edge" d="M688,196 L616,196" marker-end="url(#arrow)"/>
  <text x="652" y="170" text-anchor="middle" class="lbl">read</text>
  <text x="652" y="214" text-anchor="middle" class="lbl">write (batch)</text>
  <path class="edge" d="M430,278 L418,312" marker-end="url(#arrow)"/>
  <path class="edge" d="M500,278 L580,312" marker-end="url(#arrow)"/>
  <path class="edge" d="M560,278 L720,312" marker-end="url(#arrow)"/>

  <!-- Trust banner -->
  <rect x="40" y="470" width="840" height="96" rx="14" fill="#0f172a"/>
  <text x="64" y="502" font-size="15" class="t" fill="#34d399">Trust &amp; verification</text>
  <text x="64" y="524" font-size="12.5" fill="#e2e8f0">Receipts carry a SHA-256 commitment and an Ed25519 issuer signature, re-checked in the browser.</text>
  <text x="64" y="544" font-size="12.5" fill="#e2e8f0">Customers sign with a one-time browser key — not a legal identity. Settlement needs wallet-reported proof.</text>
  <text x="64" y="562" font-size="12.5" fill="#fca5a5">REGTEST by default · mainnet always disabled · a signature attests a record, not repair quality.</text>
</svg>
