name: JëfPass CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ORIGIN: https://jefpass.example
      LIGHTNING_NETWORK: regtest
      NWC_ALLOWED_RELAYS: wss://relay.example.test/
      AI_ENABLED: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Check production dependency advisories
        run: npm audit --omit=dev --audit-level=moderate
